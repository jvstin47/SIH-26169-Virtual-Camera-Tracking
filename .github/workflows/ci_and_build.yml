name: Phoenix-X CI & Standalone Executable Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless

      - name: Run unit test suite
        run: |
          python -m unittest discover tests

  build-windows:
    name: Build Standalone Windows Executable (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Phoenix-X-FSOC-Tracker" `
            --add-data "src;src" `
            --add-data "web_demo;web_demo" `
            main.py

      - name: Create Distribution Zip
        run: |
          Compress-Archive -Path dist\Phoenix-X-FSOC-Tracker -DestinationPath dist\Phoenix-X-FSOC-Tracker-Windows.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-X-FSOC-Tracker-Windows-x64
          path: dist\Phoenix-X-FSOC-Tracker-Windows.zip
          retention-days: 30
